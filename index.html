<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/shop-icon-32.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>Home - SHOP</title>
  </head>

  <body>
    <header class="page-header">
      <div class="header-top">
        <button type="button" class="hamburger-menu">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
          </svg>
        </button>

        <a class="brand-title" href="./index.html" aria-label="SHOP Home">SHOP</a>

        <a class="cart-link" href="./pages/cart.html" aria-label="Shopping cart: 2 items">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"
            />
          </svg>
          <span class="cart-count" aria-hidden="true">2</span>
        </a>
      </div>

      <!-- page navbar -->
      <nav class="page-nav" aria-label="Main navigation">
        <a href="./pages/product-listing-page.html">Men's Outerwear</a>
        <a href="./pages/product-listing-page.html">Ladies Outerwear</a>
        <a href="./pages/product-listing-page.html">Men's T-Shirts</a>
        <a href="./pages/product-listing-page.html">Ladies T-Shirts</a>
      </nav>
    </header>

    <main class="home-page">
      <section class="category">
        <a href="./pages/product-listing-page.html">
          <img src="./images/mens_outerwear.jpg" alt="Men's Outerwear" />
        </a>

        <div class="category-content">
          <h2>Men's Outerwear</h2>
          <a
            class="shop-button"
            href="./pages/product-listing-page.html"
            aria-label="Men's Outerwear Shop Now"
            >Shop Now</a
          >
        </div>
      </section>

      <section class="category">
        <a href="./pages/product-listing-page.html">
          <img src="./images/ladies_outerwear.jpg" alt="Ladies Outerwear" />
        </a>

        <div class="category-content">
          <h2>Ladies Outerwear</h2>
          <a
            class="shop-button"
            href="./pages/product-listing-page.html"
            aria-label="Ladies Outerwear Shop Now"
            >Shop Now</a
          >
        </div>
      </section>

      <div class="tshirt-categories">
        <section class="category">
          <a href="./pages/product-listing-page.html">
            <img src="./images/mens_tshirts.jpg" alt="Men's T-Shirts" />
          </a>

          <div class="category-content">
            <h2>Men's T-Shirts</h2>
            <a
              class="shop-button"
              href="./pages/product-listing-page.html"
              aria-label="Men's T-Shirts Shop Now"
              >Shop Now</a
            >
          </div>
        </section>

        <section class="category">
          <a href="./pages/product-listing-page.html">
            <img src="./images/ladies_tshirts.jpg" alt="Ladies T-Shirts" />
          </a>

          <div class="category-content">
            <h2>Ladies T-Shirts</h2>
            <a
              class="shop-button"
              href="./pages/product-listing-page.html"
              aria-label="Ladies T-Shirts Shop Now"
              >Shop Now</a
            >
          </div>
        </section>
      </div>
    </main>

    <footer class="page-footer">
      <a
        class="footer-link"
        target="_blank"
        rel="noopener"
        href="https://polymer-library.polymer-project.org/3.0/docs/apps/"
        >Made by Polymer</a
      >
      <p class="footer-button">Demo Only</p>
    </footer>
  </body>
</html>
