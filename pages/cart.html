<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="../images/shop-icon-32.png" />
    <link rel="stylesheet" href="../styles.css" />
    <title>Your cart - SHOP</title>
  </head>

  <body>
    <header class="page-header">
      <div class="header-top">
        <button type="button" class="hamburger-menu">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
          </svg>
        </button>

        <a class="brand-title" href="../index.html" aria-label="SHOP Home">SHOP</a>

        <a class="cart-link" href="cart.html" aria-label="Shopping cart: 2 items">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"
            />
          </svg>
          <span class="cart-count" aria-hidden="true">2</span>
        </a>
      </div>
    </header>

    <main class="cart-page">
      <div class="cart-heading">
        <h1>Your Cart</h1>
        <p class="cart-item-count">(2 items)</p>
      </div>

      <section class="cart-items">
        <article class="cart-item">
          <img
            class="cart-item-image"
            src="../data/images/10-15068B.jpg"
            alt="Men's Tech Shell Full-Zip"
          />

          <h2 class="cart-item-name">Men's Tech Shell Full-Zip</h2>

          <div class="cart-item-details">
            <div class="cart-item-quantity">
              <label for="quantity-1">Qty:</label>
              <select id="quantity-1" name="quantity-1">
                <option selected>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
              </select>
            </div>

            <div class="cart-item-size">
              <span>Size:</span>
              <span>M</span>
            </div>

            <p class="cart-item-price">$50.20</p>
          </div>

          <button
            class="remove-item"
            type="button"
            aria-label="Remove Men's Tech Shell Full-Zip from cart"
          >
            &times;
          </button>
        </article>

        <article class="cart-item">
          <img
            class="cart-item-image"
            src="../data/images/10-14154B.jpg"
            alt="Anvil L/S Crew Neck - Grey"
          />

          <h2 class="cart-item-name">Anvil L/S Crew Neck - Grey</h2>

          <div class="cart-item-details">
            <div class="cart-item-quantity">
              <label for="quantity-2">Qty:</label>
              <select id="quantity-2" name="quantity-2">
                <option selected>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
              </select>
            </div>

            <div class="cart-item-size">
              <span>Size:</span>
              <span>M</span>
            </div>

            <p class="cart-item-price">$22.15</p>
          </div>

          <button
            class="remove-item"
            type="button"
            aria-label="Remove Anvil L/S Crew Neck - Grey from cart"
          >
            &times;
          </button>
        </article>
      </section>

      <div class="cart-summary">
        <p class="cart-total">
          <span>Total:</span>
          <strong>$72.35</strong>
        </p>

        <a class="checkout-button" href="checkout.html">CHECKOUT</a>
      </div>
    </main>

    <footer class="page-footer">
      <a
        class="footer-link"
        target="_blank"
        href="https://polymer-library.polymer-project.org/3.0/docs/apps/"
        >Made by Polymer</a
      >
      <p class="footer-button">DEMO ONLY</p>
    </footer>
  </body>
</html>
